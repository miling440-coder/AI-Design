  var ENGLISH = ["Have you ever felt this way?","It seems like anything could still be possible,","yet fear leaves you unable to do anything.","Suddenly, you feel so small,","as if you cannot survive even one failure.","You want to change jobs,","but fear you will not find a better one.","You want to move to a big city,","but fear you cannot make it there alone.","You want to take the graduate entrance exam,","but fear a year of hard preparation","will still end in failure.","You may even think,","maybe I should just find someone and get married,","and settle into a steady life.","But you are still unwilling to give up.","You fear looking back a few years from now","and realizing your whole life","simply passed you by.","Then something strange happens.","You clearly have many choices,","yet in the end, you choose none.","You become more and more afraid of failure,","and feel less able to survive a single mistake.","The world is so vast,","yet you feel there is nowhere you can go.","It is as if","an invisible wall","has trapped you in place.","But later, you may realize","what truly traps you","may never have been your job,","your city,","the entrance exam,","or marriage.","It is your constant search for","a path that cannot fail.","Before changing jobs,","you want proof the next one will definitely be better.","Before moving to a big city,","you want proof you can definitely stay.","Before taking the exam,","you want to know you will definitely pass.","Even in love,","you want to know in advance","that this person will never disrupt your future.","It is not that you have no choices.","You simply want","every choice to give you a guarantee first.","But what is most cruel about life,","and most real, is this:","It never gives you the answer in advance.","Often,","we think we are pursuing security.","In fact, by telling ourselves ‘I cannot fail,’","we shrink our lives little by little.","Afraid of losing your job,","you dare not change it.","Afraid of failure,","you dare not begin.","Afraid of choosing wrong,","you choose nothing at all.","In the end, you avoid many risks,","but you also avoid","the lives that might have unfolded.","So the real question","has never been:","‘Which path is safest?’","It is:","‘If no path can guarantee success,","are you still willing","to pursue the life you truly want","and accept the possibility of failure?’","Real security","is not","‘I will never fail.’","It is:","even if I fail,","I trust myself to begin again."];
  var DURATION = 130.212938;

  (function () {
    var stage = document.getElementById("caption-stage");

    // build DOM: one .caption-group per group, .caption-word per word
    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line chinese";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        line.appendChild(span);
      });
      pill.appendChild(line);
      var english = document.createElement("div");
      english.className = "caption-english english";
      english.textContent = ENGLISH[g] || "";
      pill.appendChild(english);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? DURATION : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      // group on/off — exactly one group visible at a time
      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      // 3-state karaoke via className SETS — seek-safe (gsap.set applies on the
      // engine's frame-by-frame seek; .call callbacks would NOT fire).
      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start); // upcoming (also resets on reverse-seek)
        tl.set(el, { className: "caption-word is-active" }, at); // current
        tl.fromTo(el, { scale: 0.985 }, { scale: 1, duration: 0.2, ease: "power1.out" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt); // demote when next activates
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        tl.set(lastEl, { className: "caption-word is-spoken" }, lastSpoken);
      }
    });

    // full-span anchor so the sub-comp timeline spans the whole video
