      <!-- Scene 01
     你有没有过这样的感觉 -->
    <img class="clip scene-img"
        src="assets/img/01.png"
        data-start="0"
        data-duration="1.923"
        data-media-start="0">

    <!-- Scene 02
        自己陷入那种好像什么都有一点可能，
        但又什么都做不到的恐惧里 -->
    <img class="clip scene-img"
        src="assets/img/02.png"
        data-start="1.923"
        data-duration="4.931"
        data-media-start="0">

    <!-- Scene 03
        你突然觉得自己很弱小 -->
    <img class="clip scene-img"
        src="assets/img/03.png"
        data-start="6.854"
        data-duration="2.013"
        data-media-start="0">

    <!-- Scene 04
        好像已经经不起任何一次失败 -->
    <img class="clip scene-img"
        src="assets/img/04.png"
        data-start="8.867"
        data-duration="2.335"
        data-media-start="0">

    <!-- Scene 05
        想换工作，
        又怕找不到更好的 -->
    <img class="clip scene-img"
        src="assets/img/05.png"
        data-start="11.202"
        data-duration="2.870"
        data-media-start="0">

    <!-- Scene 06
        想去大城市，
        又怕一个人在那里撑不下来 -->
    <img class="clip scene-img"
        src="assets/img/06.png"
        data-start="14.072"
        data-duration="3.355"
        data-media-start="0">

    <!-- Scene 07
        想考研，
        又怕辛辛苦苦准备一年，
        最后还是失败 -->
    <img class="clip scene-img"
        src="assets/img/07.png"
        data-start="17.427"
        data-duration="4.389"
        data-media-start="0">

    <!-- Scene 08
        甚至想过，
        要不就找个人结婚，
        安安稳稳过日子算了 -->
    <img class="clip scene-img"
        src="assets/img/08.png"
        data-start="21.816"
        data-duration="4.598"
        data-media-start="0">

    <!-- Scene 09
        可你又不甘心。
        你害怕几年以后回过头来，
        发现这一辈子，
        就这样过去了 -->
    <img class="clip scene-img"
        src="assets/img/09.png"
        data-start="26.414"
        data-duration="6.182"
        data-media-start="0">

    <!-- Scene 10
        于是很奇怪的一件事发生了。
        你明明有很多选择，
        最后却什么都没有选 -->
    <img class="clip scene-img"
        src="assets/img/10.png"
        data-start="32.596"
        data-duration="5.914"
        data-media-start="0">

    <!-- Scene 11
        你越来越害怕失败，
        越来越觉得自己经不起任何一次失误 -->
    <img class="clip scene-img"
        src="assets/img/11.png"
        data-start="38.510"
        data-duration="4.855"
        data-media-start="0">

    <!-- Scene 12
        世界那么大，
        你却觉得自己哪里也去不了 -->
    <img class="clip scene-img"
        src="assets/img/12.png"
        data-start="43.365"
        data-duration="3.359"
        data-media-start="0">

    <!-- Scene 13
        就好像，
        有一堵看不见的墙，
        把你困在了原地 -->
    <img class="clip scene-img"
        src="assets/img/13.png"
        data-start="46.724"
        data-duration="3.885"
        data-media-start="0">

    <!-- Scene 14
        可后来你会发现，
        真正困住你的，
        可能从来都不是工作，
        不是城市，
        不是考研，
        也不是婚姻 -->
    <img class="clip scene-img"
        src="assets/img/14.png"
        data-start="50.609"
        data-duration="8.172"
        data-media-start="0">

    <!-- Scene 15
        而是你总想找到一条 -->
    <img class="clip scene-img"
        src="assets/img/15.png"
        data-start="58.781"
        data-duration="1.853"
        data-media-start="0">

    <!-- Scene 16
        “不会失败的路” -->
    <img class="clip scene-img"
        src="assets/img/16.png"
        data-start="60.634"
        data-duration="1.307"
        data-media-start="0">

    <!-- Scene 17
        换工作之前，
        你想先确定下一份工作一定更好 -->
    <img class="clip scene-img"
        src="assets/img/17.png"
        data-start="61.941"
        data-duration="3.864"
        data-media-start="0">

    <!-- Scene 18
        去大城市之前，
        你想先确定自己一定能留下来 -->
    <img class="clip scene-img"
        src="assets/img/18.png"
        data-start="65.805"
        data-duration="3.840"
        data-media-start="0">

    <!-- Scene 19
        考研之前，
        你想先知道自己一定能考上 -->
    <img class="clip scene-img"
        src="assets/img/19.png"
        data-start="69.645"
        data-duration="3.267"
        data-media-start="0">

    <!-- Scene 20
        甚至面对爱情，
        你也希望先确定，
        这个人绝不会影响你未来的人生 -->
    <img class="clip scene-img"
        src="assets/img/20.png"
        data-start="72.912"
        data-duration="5.371"
        data-media-start="0">

    <!-- Scene 21
        你不是没有选择 -->
    <img class="clip scene-img"
        src="assets/img/21.png"
        data-start="78.283"
        data-duration="1.531"
        data-media-start="0">

    <!-- Scene 22
        你只是希望 -->
    <img class="clip scene-img"
        src="assets/img/22.png"
        data-start="79.814"
        data-duration="1.243"
        data-media-start="0">

    <!-- Scene 23
        每一个选择都先给你一个保证 -->
    <img class="clip scene-img"
        src="assets/img/23.png"
        data-start="81.057"
        data-duration="2.201"
        data-media-start="0">

    <!-- Scene 24
        可人生最残酷，
        也最真实的地方就在这里：
        它从来不会先告诉你答案 -->
    <img class="clip scene-img"
        src="assets/img/24.png"
        data-start="83.258"
        data-duration="5.858"
        data-media-start="0">

    <!-- Scene 25
        很多时候，
        我们以为自己是在追求安全感 -->
    <img class="clip scene-img"
        src="assets/img/25.png"
        data-start="89.116"
        data-duration="3.420"
        data-media-start="0">

    <!-- Scene 26
        其实是在用“我不能失败”，
        一点一点缩小自己的人生 -->
    <img class="clip scene-img"
        src="assets/img/26.png"
        data-start="92.536"
        data-duration="3.993"
        data-media-start="0">

    <!-- Scene 27
        怕失业，
        于是你不敢换工作。
        怕失败，
        于是你不敢开始。
        怕选错，
        于是干脆什么都不选 -->
    <img class="clip scene-img"
        src="assets/img/27.png"
        data-start="96.529"
        data-duration="7.947"
        data-media-start="0">

    <!-- Scene 28
        最后你避开了很多风险，
        也一起避开了那些，
        本来可能发生的人生 -->
    <img class="clip scene-img"
        src="assets/img/28.png"
        data-start="104.476"
        data-duration="5.261"
        data-media-start="0">

    <!-- Scene 29
        所以真正的问题，
        从来不是：
        “哪条路最安全？” -->
    <img class="clip scene-img"
        src="assets/img/29.png"
        data-start="109.737"
        data-duration="4.056"
        data-media-start="0">

    <!-- Scene 30
        而是：
        “如果没有任何一条路能保证成功，
        你还愿不愿意，
        为自己真正想要的人生，
        承担一次失败的可能？” -->
    <img class="clip scene-img"
        src="assets/img/30.png"
        data-start="113.793"
        data-duration="8.136"
        data-media-start="0">

    <!-- Scene 31
        真正的安全感，
        从来不是
        “我永远不会失败” -->
    <img class="clip scene-img"
        src="assets/img/31.png"
        data-start="121.929"
        data-duration="3.910"
        data-media-start="0">

    <!-- Scene 32
        而是：
        即使失败了，
        我也相信自己有重新来过的能力 -->
    <img class="clip scene-img"
        src="assets/img/32.png"
        data-start="125.84"
        data-duration="4.37"
        data-media-start="0">
