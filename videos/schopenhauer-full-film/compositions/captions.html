<div data-hf-id="hf-71xo" id="quiet-captions-root" data-composition-id="quiet-captions" data-width="1920" data-height="1080" data-duration="150">
  <p data-hf-id="hf-xsw7" id="line-01" class="line">我们总以为，再往前一点，生活就会好起来。</p>
  <p data-hf-id="hf-zvi5" id="line-02" class="line">于是，得到一个，又等待下一个。</p>
  <p data-hf-id="hf-tcle" id="line-03" class="line long">曾经渴望很久的东西，真正拥有以后，兴奋却总比想象中消失得更快。</p>
  <p data-hf-id="hf-v4ay" id="line-04" class="line short">然后，一个问题悄悄出现——<em data-hf-id="hf-3uhs">然后呢？</em></p>
  <p data-hf-id="hf-sfv2" id="line-05" class="line">两百年前，叔本华把人的一生，比作一只钟摆。</p>
  <p data-hf-id="hf-cc8o" id="line-06" class="line short">一边，是<em data-hf-id="hf-b0di">痛苦</em>。另一边，是<em data-hf-id="hf-f5al">无聊</em>。</p>
  <p data-hf-id="hf-rfn1" id="line-07" class="line">欲望还没有被满足时，人因缺少而痛苦。</p>
  <p data-hf-id="hf-1zjx" id="line-08" class="line long">欲望真的被满足以后，短暂的快乐过去，无聊又重新出现。</p>
  <p data-hf-id="hf-6wn9" id="line-09" class="line">于是钟摆再次摆动。新的目标，新的期待，新的欲望。</p>
  <p data-hf-id="hf-wbcs" id="line-10" class="line">我们不停地往生活里增加东西。</p>
  <p data-hf-id="hf-ezat" id="line-10b" class="line long">仿佛足够忙、足够热闹、足够充实，那阵空就不会出现。</p>
  <p data-hf-id="hf-zfyp" id="line-11" class="line">工作填满白天。消息填满间隙。</p>
  <p data-hf-id="hf-vi4k" id="line-12" class="line">音乐填满房间。短视频填满深夜。</p>
  <p data-hf-id="hf-av2e" id="line-13" class="line">我们越来越不习惯，什么都不发生。</p>
  <p data-hf-id="hf-ac8v" id="line-14" class="line long">可外面的声音再多，也无法永远盖住里面的安静。</p>
  <p data-hf-id="hf-69yo" id="line-15" class="line">散场以后，人群离开。音乐停止。灯一盏一盏熄灭。</p>
  <p data-hf-id="hf-xbkx" id="line-16" class="line short">那阵<em data-hf-id="hf-zefr">空</em>，还是会回来。</p>
  <p data-hf-id="hf-tifj" id="line-17" class="line long">叔本华的悲观，也许并不是在说：人生没有希望。</p>
  <p data-hf-id="hf-tv6d" id="line-18" class="line short">而是在提醒我们——</p>
  <p data-hf-id="hf-mfu0" id="line-19" class="line long">如果幸福永远在下一个欲望里，那么<em data-hf-id="hf-8nee">此刻</em>，就永远只是等待。</p>
  <p data-hf-id="hf-fk5c" id="line-20" class="line">真正困难的，或许从来不是得到更多。</p>
  <p data-hf-id="hf-00av" id="line-21" class="line long">而是有一天，面对尚未被填满的空白，你不再立刻寻找下一样东西。</p>
  <p data-hf-id="hf-rhji" id="line-22" class="line long">不急着逃离。不急着填满。不急着证明生活正在发生。</p>
  <p data-hf-id="hf-d0vo" id="line-23" class="line short">只是安静地，待在那里。</p>
  <p data-hf-id="hf-jkb0" id="line-24" class="line">也许从那一刻开始，钟摆仍然会摆动。</p>
  <p data-hf-id="hf-jlkz" id="line-25" class="line short">但你，不再必须追着它走。</p>
  <p data-hf-id="hf-xvmn" id="line-26" class="line">散场后的那阵空，也不再只是失落。</p>
  <p data-hf-id="hf-zxbl" id="line-27" class="line short">当所有声音退去，你终于，<em data-hf-id="hf-7bdn">听见了自己。</em></p>
