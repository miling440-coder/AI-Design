<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "STSong";
        src: local("STSong"), local("华文宋体");
      }

      @font-face {
        font-family: "SimSun";
        src: local("SimSun"), local("宋体");
      }

      :root {
        --night: #0b1115;
        --mist: #8fa2ad;
        --paper: #eee9df;
        --gold: #c8a76a;
        --slate: #2a363d;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--night); }
      body { color: var(--paper); font-family: STSong, SimSun, serif; }
      #root, #visual { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

      #visual {
        isolation: isolate;
        background:
          radial-gradient(circle at 50% 56%, rgba(143, 162, 173, 0.11), transparent 28%),
          radial-gradient(circle at 15% 10%, rgba(200, 167, 106, 0.06), transparent 24%),
          var(--night);
      }

      .grain {
        position: absolute; inset: 0; z-index: 2; opacity: 0.13; pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
        mix-blend-mode: soft-light;
      }

      .frame-rule { position: absolute; inset: 54px; z-index: 3; border: 1px solid rgba(143, 162, 173, 0.18); }
      .frame-rule::before, .frame-rule::after {
        content: ""; position: absolute; top: -1px; width: 190px; height: 1px;
        background: var(--gold); opacity: 0.72;
      }
      .frame-rule::before { left: 0; }
      .frame-rule::after { right: 0; }

      .meta {
        position: absolute; top: 82px; left: 88px; right: 88px; z-index: 12;
        display: flex; align-items: center; justify-content: space-between;
        color: rgba(238, 233, 223, 0.68); font-family: Consolas, monospace;
        font-size: 21px; letter-spacing: 0.18em; text-transform: uppercase;
      }
      .meta strong { color: var(--gold); font-weight: 400; }

      .axis-word {
        position: absolute; top: 454px; z-index: 4; color: rgba(143, 162, 173, 0.13);
        font-size: 152px; font-weight: 700; letter-spacing: 0.08em; writing-mode: vertical-rl;
      }
      #pain { left: 228px; }
      #boredom { right: 228px; }

      .pendulum-svg { position: absolute; inset: 0; z-index: 7; width: 100%; height: 100%; overflow: visible; }
      .pendulum-line { stroke: var(--gold); stroke-width: 3; opacity: 0.76; }
      .pendulum-ring { fill: none; stroke: rgba(200, 167, 106, 0.3); stroke-width: 2; }
      .pendulum-bob { fill: var(--gold); }
      .pivot { fill: var(--paper); }
      .orbit { fill: none; stroke: rgba(143, 162, 173, 0.17); stroke-width: 1; stroke-dasharray: 5 13; }

      .crowd { position: absolute; inset: 0; z-index: 5; filter: blur(1.5px); }
      .spark {
        position: absolute; left: var(--x); top: var(--y); width: var(--s); height: var(--s);
        border-radius: 999px; background: var(--c);
        box-shadow: 0 0 34px color-mix(in srgb, var(--c) 68%, transparent); opacity: 0.52;
      }

      .quote {
        position: absolute; left: 150px; bottom: 112px; z-index: 14; max-width: 1320px;
        font-size: 72px; font-weight: 700; line-height: 1.28; letter-spacing: 0.01em;
        text-wrap: balance; text-shadow: 0 6px 32px rgba(11, 17, 21, 0.62);
      }
      .quote em { color: var(--gold); font-style: normal; }
      #quote-two { left: auto; right: 150px; max-width: 1020px; text-align: right; font-size: 68px; font-weight: 400; }
      .source-tag {
        display: block; margin-bottom: 18px; color: rgba(143, 162, 173, 0.84);
        font-family: Consolas, monospace; font-size: 19px; font-weight: 400; letter-spacing: 0.2em;
      }

      .freedom-field {
        position: absolute; left: 50%; top: 62%; z-index: 20; width: 180px; height: 180px;
        margin: -90px 0 0 -90px; border-radius: 999px; background: var(--paper);
        box-shadow: 0 0 120px rgba(238, 233, 223, 0.26);
      }
      .final-card {
        position: absolute; inset: 0; z-index: 24; display: flex; flex-direction: column;
        align-items: flex-start; justify-content: center; padding: 110px 170px; color: var(--night);
      }
      .final-kicker {
        margin-bottom: 28px; color: #51616a; font-family: Consolas, monospace;
        font-size: 22px; letter-spacing: 0.18em;
      }
      .final-line { max-width: 1650px; font-size: 82px; font-weight: 700; line-height: 1.2; letter-spacing: -0.015em; }
      .final-line span { color: #9b733e; font-size: 108px; white-space: nowrap; }
      .final-rule { width: 540px; height: 2px; margin-top: 44px; background: #9b733e; transform-origin: left center; }
    </style>
  </head>

          <g data-hf-id="hf-asu5" id="pendulum">

          <div data-hf-id="hf-gpzf" class="final-rule"></div>
        </div>
      </section>
    </main>
